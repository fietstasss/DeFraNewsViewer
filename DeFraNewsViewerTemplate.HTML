<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      /**
        * GLOBAL CONFIGURATION
        * Dashboard for all visual and logic settings
        */
      const VIEWER_CONFIG = {
        // --- TEXT SCROLL SETTINGS (NU DYNAMISCH) ---
        // pixelsPerSecond wordt nu genegeerd ten gunste van de Master-tijd
        pauseAtStart:  2*1000,        // Delay at the top (ms)
        pauseAtEnd:   10*1000,          // Delay at the bottom (ms)
        showTextProgress: true,    // Show/hide the vertical progress bar for text
        scrollBottomPadding: 120,   // Extra distance for the text to end at after scrolling (px)

        // --- PILL ARTICLE INDICATORS ---
        pillWidth: "100px",         // Breedte van de pil
        pillHeight: "12px",         // Hoogte van de pil
        pillRadius: "6px",         // Ronding van de pil
        pillSpacing: "10px",       // Ruimte tussen de pillen
        
        // --- TYPOGRAPHY & SPACING ---
        fontSizeText: "2.2rem",    // Grootte van de hoofdtekst
        fontSizeSubtitle: "3.0rem",// Grootte van de oranje titel
        contentPadding: "10px 60px",// Witruimte rondom de tekst
        
        // --- PHOTO SETTINGS (DYNAMISCH) ---
        startDelay: 1000,          // Delay before first photo pop-in (ms)
        staggerDelay: 600,         // Delay between first and second photo in grid (ms)
        imageRadius: "0px",         // Border radius for images (px)

        // imageTransitionMode: "slide",                 // Choose one effect: slide | fade | cut | slide | fade-through | wipe | scale-blur
        // imageTransitionMode: "fade",               // Choose one effect: slide | fade | cut | slide | fade-through | wipe | scale-blur
        // imageTransitionMode: "cut",                // Choose one effect: slide | fade | cut | slide | fade-through | wipe | scale-blur
        // imageTransitionMode: "fade-through",       // Choose one effect: slide | fade | cut | slide | fade-through | wipe | scale-blur
        imageTransitionMode: "wipe",               // Choose one effect: slide | fade | cut | slide | fade-through | wipe | scale-blur
        // imageTransitionMode: "scale-blur",         // Choose one effect: slide | fade | cut | slide | fade-through | wipe | scale-blur
        
        
        imageTransitionSpeed: 3700,  // Image transition/effect/animation duration (ms)
        imageTransitionDirection: "left", // left | right
        imageNeutralColor: "#f5f5f5", // Used by fade-through
        
        // --- VISUAL EFFECTS (THE DIALS) ---
        fadeSpeed: 0.5,            // Speed of the photo cross-fade (seconds)
        zoomScale: 1.05,           // How much the photo zooms in (1.05 = 5%)
        zoomDuration: 15,          // Fallback duration (seconds) - wordt dynamisch overschreven per artikel
        photoShadow: 0.15,         // Shadow intensity (0 to 1)
        useAnimations: true,       // Enable/disable fade-in effects

        // --- SWIPE TRANSITIONS ---
        swipeOutDuration: 2320,      // Swipe-out duration (ms)
        swipeInDuration: 2520,       // Swipe-in duration (ms)
        swipeDistance: 142           // Swipe distance (px)
      };
    </script>
    <style>
      :root {
        /* UI Colors */
        --primary-blue: #1a4a7c;
        --accent-orange: #e67e22;
        --text-dark: #2c3e50;
        --white: #ffffff;
        --light-bg: #fcfcfc;
        --photo-bg: #f0f0f0;
      }

      /* --- BASE LAYOUT --- */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body,
      html {
        height: 100%;
        width: 100%;
        font-family: 'Segoe UI', sans-serif;
        background-color: var(--white);
        overflow: hidden;
      }

      .fullscreen-wrapper {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }

      /* Header Area */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 50px;
        height: 100px;
        background: var(--white);
        border-bottom: 2px solid #eee;
        flex-shrink: 0;
      }

      .logo {
        font-weight: 900;
        font-size: 2.5rem;
        color: var(--text-dark);
      }

      .main-title {
        font-size: 2.2rem;
        color: var(--text-dark);
        border-right: 8px solid var(--accent-orange);
        padding-right: 20px;
      }

      /* Meta Data Bar */
      .info-bar {
        background: linear-gradient(90deg, var(--primary-blue), #2c5e91);
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        color: white;
        padding: 0 50px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 1.2rem;
        flex-shrink: 0;
      }

      /* Content Grid */
      .main-content {
        display: grid;
        grid-template-columns: 45% 55%;
        flex: 1;
        min-height: 0;
        height: 0;
        background: var(--light-bg);
      }

      /* --- IMAGE SECTION (Left) --- */
      .image-side {
        position: relative;
        display: block;
        height: 100%;
        width: 100%;
        background-color: transparent;
        overflow: hidden;
      }

      .image-item {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0;
        display: block;
        box-shadow: 0 0 25px rgba(0, 0, 0, var(--computed-shadow));
        border-radius: var(--image-radius); /* Pas de 20px aan naar smaak voor rondere of rechtere hoeken */
        overflow: hidden;    /* Zorgt ervoor dat de afbeelding echt binnen de ronde hoeken blijft */
        --img-anim: none;

      }

      .image-item.active {
        opacity: 1;
        animation: var(--img-anim), slowZoom var(--computed-zoom-duration) ease-in-out forwards;
      }

      .image-item.transition-fade {
        transition: opacity var(--computed-fade-speed) ease-in-out;
      }

      .image-item.slide-in-left {
        --img-anim: imgSlideInLeft var(--img-trans-duration) cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      .image-item.slide-out-left {
        animation: imgSlideOutLeft var(--img-trans-duration) cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      .image-item.slide-in-right {
        --img-anim: imgSlideInRight var(--img-trans-duration) cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      .image-item.slide-out-right {
        animation: imgSlideOutRight var(--img-trans-duration) cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      .image-item.wipe-in-left {
        --img-anim: imgWipeInLeft var(--img-trans-duration) cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      .image-item.wipe-in-right {
        --img-anim: imgWipeInRight var(--img-trans-duration) cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      .image-item.scale-blur-in {
        --img-anim: imgScaleBlurIn var(--img-trans-duration) cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      .image-item.scale-blur-out {
        animation: imgScaleBlurOut var(--img-trans-duration) cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      .neutral-fade-layer {
        position: absolute;
        inset: 0;
        background: var(--neutral-color);
        opacity: 0;
        transition: opacity var(--img-trans-duration) ease;
        pointer-events: none;
        z-index: 10;
      }

      .image-exit {
        opacity: 0 !important;
      }

      @keyframes slowZoom {
          0% { transform: scale(1.0); }
          100% { transform: scale(var(--computed-zoom-scale)); }
      }

      @keyframes imgSlideInLeft {
        from { opacity: 0; transform: translateX(6%); }
        to { opacity: 1; transform: translateX(0); }
      }

      @keyframes imgSlideOutLeft {
        from { opacity: 1; transform: translateX(0); }
        to { opacity: 0; transform: translateX(-6%); }
      }

      @keyframes imgSlideInRight {
        from { opacity: 0; transform: translateX(-6%); }
        to { opacity: 1; transform: translateX(0); }
      }

      @keyframes imgSlideOutRight {
        from { opacity: 1; transform: translateX(0); }
        to { opacity: 0; transform: translateX(6%); }
      }

      @keyframes imgWipeInLeft {
        from { opacity: 0; clip-path: inset(0 100% 0 0); }
        to { opacity: 1; clip-path: inset(0 0 0 0); }
      }

      @keyframes imgWipeInRight {
        from { opacity: 0; clip-path: inset(0 0 0 100%); }
        to { opacity: 1; clip-path: inset(0 0 0 0); }
      }

      @keyframes imgScaleBlurIn {
        from { opacity: 0; transform: scale(1.04); filter: blur(10px); }
        to { opacity: 1; transform: scale(1); filter: blur(0); }
      }

      @keyframes imgScaleBlurOut {
        from { opacity: 1; transform: scale(1); filter: blur(0); }
        to { opacity: 0; transform: scale(0.98); filter: blur(10px); }
      }

      /* --- TEXT SECTION (Right) --- */
      .text-side {
        background-color: var(--light-bg);
        padding: var(--computed-padding);
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
      }

      .sub-header {
        font-size: var(--computed-subtitle-size);
        color: var(--accent-orange);
        font-weight: 800;
        margin-bottom: 20px;
        line-height: 1.1;
        flex-shrink: 0;
        z-index: 10;
        background: transparent;
        position: relative;
      }

      .scroll-window {
        flex-grow: 1;
        overflow: hidden;
        position: relative;
        margin-top: 0;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 40px, black calc(100% - 40px), transparent 100%);
        mask-image: linear-gradient(to bottom, transparent 0%, black 40px, black calc(100% - 40px), transparent 100%);
      }

      .scroll-container {
        display: flex;
        flex-direction: column;
        width: 100%;
        padding-top: 10px;
      }

      .text-content {
        font-size: var(--computed-text-size);
        line-height: 1.7;
        color: var(--text-dark);
        white-space: pre-wrap;
      }

      .text-content p {
        margin-bottom: 40px;
      }

      .image-side.swipe-out {
        animation: imageSwipeOut var(--swipe-out) cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      .image-side.swipe-in {
        animation: imageSwipeIn var(--swipe-in) cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .text-side.swipe-out {
        animation: textSwipeOut var(--swipe-out) cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      .text-side.swipe-in {
        animation: textSwipeIn var(--swipe-in) cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .content-swap {
        animation: contentSwap 0.6s ease;
      }

      .meta-swap {
        animation: metaSwap 0.4s ease;
      }

      /* --- VERTICAL TEXT PROGRESS INDICATOR --- */
      .text-progress-track {
        position: absolute;
        right: 20px;
        top: 60px;
        bottom: 60px;
        width: 4px;
        background: rgba(0, 0, 0, 0.05);
        border-radius: 2px;
        overflow: hidden;
        display: none;
      }

      .text-progress-bar {
        width: 100%;
        height: 0%;
        background: var(--accent-orange);
        border-radius: 2px;
      }

      /* --- CARROUSEL INDICATORS (Bottom) --- */
      .photo-indicators {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        z-index: 20;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 8px 16px;
        border-radius: 20px;
        gap: 10px;
      }

      .indicator-segment {
        width: 35px;
        height: 3px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 2px;
        overflow: hidden;
        position: relative;
      }

      .indicator-segment.active::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        background: var(--white);
        animation: progressFill var(--photo-time) linear forwards;
      }

      .mini-pill {
          width: var(--computed-pill-width);
          height: var(--computed-pill-height);
          background: rgba(255, 255, 255, 0.2);
          border-radius: var(--computed-pill-radius);
          position: relative;
          overflow: hidden;
      }
      .mini-pill.active::after {
          content: '';
          position: absolute;
          left: 0; top: 0; height: 100%; width: 0%;
          background: var(--accent-orange);
          animation: pillProgress linear forwards;
          animation-duration: var(--pill-duration);
      }
      .mini-pill.completed { background: var(--accent-orange); }
      @keyframes pillProgress { from { width: 0%; } to { width: 100%; } }

      @keyframes progressFill {
        from { width: 0%; }
        to { width: 100%; }
      }

      @keyframes imageSwipeOut {
        from { opacity: 1; transform: translateX(0); }
        to { opacity: 0; transform: translateX(calc(-1 * var(--swipe-distance))); }
      }

      @keyframes imageSwipeIn {
        from { opacity: 0; transform: translateX(calc(-1 * var(--swipe-distance))); }
        to { opacity: 1; transform: translateX(0); }
      }

      @keyframes textSwipeOut {
        from { opacity: 1; transform: translateX(0); }
        to { opacity: 0; transform: translateX(var(--swipe-distance)); }
      }

      @keyframes textSwipeIn {
        from { opacity: 0; transform: translateX(var(--swipe-distance)); }
        to { opacity: 1; transform: translateX(0); }
      }

      @keyframes contentSwap {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes metaSwap {
        from { opacity: 0; transform: translateY(-6px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div class="fullscreen-wrapper">
      <header class="header">
        <div class="logo">DEFRA NEWS</div>
        <div class="main-title" id="view-title">Loading...</div>
      </header>
      <div class="info-bar">
        <span id="view-date" style="flex: 1; text-align: left;"></span>
        <div id="view-pills" style="flex: 1; display: flex; justify-content: center; gap: 8px;"></div>
        <span id="view-authors" style="flex: 1; text-align: right;"></span>        
      </div>
      <main class="main-content">
        <section class="image-side" id="image-display-area"></section>
        <article class="text-side">
          <h2 class="sub-header" id="view-subtitle"></h2>
          <div id="text-track" class="text-progress-track">
            <div id="text-progress-bar" class="text-progress-bar"></div>
          </div>
          <div class="scroll-window">
            <div class="scroll-container" id="scroll-target">
              <div class="text-content" id="view-text"></div>
            </div>
          </div>
        </article>
      </main>
    </div>
    <script>
      // Inject CSS variables from Config
      document.documentElement.style.setProperty('--computed-fade-speed', VIEWER_CONFIG.fadeSpeed + 's');
      document.documentElement.style.setProperty('--computed-zoom-duration', VIEWER_CONFIG.zoomDuration + 's');
      document.documentElement.style.setProperty('--computed-zoom-scale', VIEWER_CONFIG.zoomScale);
      document.documentElement.style.setProperty('--computed-shadow', VIEWER_CONFIG.photoShadow);
      document.documentElement.style.setProperty('--computed-text-size', VIEWER_CONFIG.fontSizeText);
      document.documentElement.style.setProperty('--computed-subtitle-size', VIEWER_CONFIG.fontSizeSubtitle);
      document.documentElement.style.setProperty('--computed-padding', VIEWER_CONFIG.contentPadding);
      document.documentElement.style.setProperty('--image-radius', VIEWER_CONFIG.imageRadius);
      document.documentElement.style.setProperty('--computed-pill-width', VIEWER_CONFIG.pillWidth);
      document.documentElement.style.setProperty('--computed-pill-height', VIEWER_CONFIG.pillHeight);
      document.documentElement.style.setProperty('--computed-pill-radius', VIEWER_CONFIG.pillRadius);
      document.documentElement.style.setProperty('--swipe-out', (VIEWER_CONFIG.swipeOutDuration / 1000) + 's');
      document.documentElement.style.setProperty('--swipe-in', (VIEWER_CONFIG.swipeInDuration / 1000) + 's');
      document.documentElement.style.setProperty('--swipe-distance', VIEWER_CONFIG.swipeDistance + 'px');
      document.documentElement.style.setProperty('--img-trans-duration', (VIEWER_CONFIG.imageTransitionSpeed / 1000) + 's');
      document.documentElement.style.setProperty('--neutral-color', VIEWER_CONFIG.imageNeutralColor);

      let swipeToken = 0;
      let imageUpdateToken = 0;
      let hasRenderedImages = false;
      let scrollInitTimer = null;

      function restartAnimation(el, className) {
        if (!el) return;
        el.classList.remove(className);
        void el.offsetWidth;
        el.classList.add(className);
      }

      function triggerSwapAnimation() {
        if (!VIEWER_CONFIG.useAnimations) return;
        const metaTargets = [
          document.getElementById('view-title'),
          document.getElementById('view-date'),
          document.getElementById('view-authors'),
          document.getElementById('view-pills')
        ];
        metaTargets.forEach((el) => restartAnimation(el, 'meta-swap'));
      }

      function resetScrollState() {
        const scrollContainer = document.getElementById('scroll-target');
        const progressTrack = document.getElementById('text-track');
        const progressBar = document.getElementById('text-progress-bar');
        if (scrollInitTimer) {
          clearTimeout(scrollInitTimer);
          scrollInitTimer = null;
        }
        if (scrollContainer) {
          scrollContainer.style.animation = "none";
          scrollContainer.style.transform = "translateY(0)";
        }
        if (progressBar) {
          progressBar.style.animation = "none";
          progressBar.style.height = "0%";
          progressBar.style.transform = "none";
        }
        if (progressTrack) {
          progressTrack.style.display = 'none';
        }
      }

      function startScroll(data) {
        const scrollContainer = document.getElementById('scroll-target');
        const scrollWindow = document.querySelector('.scroll-window');
        const progressBar = document.getElementById('text-progress-bar');
        const progressTrack = document.getElementById('text-track');

        if (!scrollContainer || !scrollWindow) return;

        if (scrollInitTimer) {
          clearTimeout(scrollInitTimer);
          scrollInitTimer = null;
        }

        // Wait two frames so layout (scrollHeight) is accurate after content update
        scrollInitTimer = setTimeout(() => {
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
          const textHeight = scrollContainer.scrollHeight;
          const windowHeight = scrollWindow.offsetHeight;

          // Totale tijd van de Master (bijv. 30000ms)
          const masterTotalTime = data.displayTime || 30000;
          const startPauseMs = VIEWER_CONFIG.pauseAtStart || 0;
          const endPauseMs = VIEWER_CONFIG.pauseAtEnd || 0;
          const scrollDurationMs = Math.max(0, masterTotalTime - startPauseMs - endPauseMs);

          if (textHeight > windowHeight && scrollDurationMs > 0) {
            const bottomPadding = VIEWER_CONFIG.scrollBottomPadding || 0;
            const distance = textHeight - windowHeight + bottomPadding;

            if (VIEWER_CONFIG.showTextProgress) progressTrack.style.display = 'block';

            const styleId = 'dynamic-animations';
            let styleTag = document.getElementById(styleId);
            if (!styleTag) {
              styleTag = document.createElement('style');
              styleTag.id = styleId;
              document.head.appendChild(styleTag);
            }
            styleTag.innerHTML = `
              @keyframes dynamicAutoScroll {
                from { transform: translateY(0); }
                to { transform: translateY(-${distance}px); }
              }
              @keyframes dynamicProgressHeight {
                from { height: 0%; }
                to { height: 100%; }
              }
            `;

            scrollContainer.style.animation = "none";
            progressBar.style.animation = "none";
            progressBar.style.height = "0%";
            void scrollContainer.offsetWidth;
            void progressBar.offsetHeight;

            scrollContainer.style.animation = `dynamicAutoScroll ${scrollDurationMs / 1000}s linear ${startPauseMs / 1000}s 1 forwards`;
            progressBar.style.animation = `dynamicProgressHeight ${scrollDurationMs / 1000}s linear ${startPauseMs / 1000}s 1 forwards`;
            scrollContainer.style.animationDirection = 'normal';
            progressBar.style.animationDirection = 'normal';
          } else {
            scrollContainer.style.animation = "none";
            progressTrack.style.display = 'none';
          }
            });
          });
        }, 0);
      }
      function runSwipeTransition(updateFn) {
        if (!VIEWER_CONFIG.useAnimations) {
          updateFn();
          return;
        }

        const textSide = document.querySelector('.text-side');
        const imageSide = document.querySelector('.image-side');
        const outMs = VIEWER_CONFIG.swipeOutDuration || 300;
        const inMs = VIEWER_CONFIG.swipeInDuration || 500;
        const currentToken = ++swipeToken;

        if (window.swipeTimers) {
          window.swipeTimers.forEach((t) => clearTimeout(t));
        }
        window.swipeTimers = [];

        textSide.classList.remove('swipe-in', 'swipe-out');
        imageSide.classList.remove('swipe-in', 'swipe-out');
        void textSide.offsetWidth;
        void imageSide.offsetWidth;
        textSide.classList.add('swipe-out');
        imageSide.classList.add('swipe-out');

        window.swipeTimers.push(setTimeout(() => {
          Promise.resolve(updateFn()).then(() => {
            if (currentToken !== swipeToken) return;
            textSide.classList.remove('swipe-out');
            imageSide.classList.remove('swipe-out');
            void textSide.offsetWidth;
            void imageSide.offsetWidth;
            textSide.classList.add('swipe-in');
            imageSide.classList.add('swipe-in');

            window.swipeTimers.push(setTimeout(() => {
              if (currentToken !== swipeToken) return;
              textSide.classList.remove('swipe-in');
              imageSide.classList.remove('swipe-in');
            }, inMs + 40));
          });
        }, outMs));
      }

      function updateImages(data) {
        const token = ++imageUpdateToken;
        const container = document.getElementById('image-display-area');
        const photos = data.images || [];
        if (window.photoInterval) clearInterval(window.photoInterval);

        const placeholder = document.createElement('div');
        placeholder.style.background = "var(--light-bg)";
        placeholder.style.height = "100%";
        placeholder.style.width = "100%";

        container.innerHTML = '';
        container.appendChild(placeholder);

        const startDelay = hasRenderedImages ? 0 : VIEWER_CONFIG.startDelay;

        return new Promise((resolve) => {
          let readySent = false;
          const signalReady = () => {
            if (readySent) return;
            readySent = true;
            resolve();
          };

          const safeTimer = setTimeout(() => {
            signalReady();
          }, 1200);

          setTimeout(() => {
            if (token !== imageUpdateToken) {
              clearTimeout(safeTimer);
              signalReady();
              return;
            }

            container.innerHTML = '';
            if (photos.length === 0) {
              container.appendChild(placeholder);
              hasRenderedImages = true;
              clearTimeout(safeTimer);
              signalReady();
              return;
            }

            let idx = 0;
            const masterDisplayTime = data.displayTime || 30000;
            const dynamicPhotoTime = masterDisplayTime / photos.length;
            container.style.setProperty('--computed-zoom-duration', (dynamicPhotoTime / 1000) + 's');
            container.style.setProperty('--img-trans-duration', (VIEWER_CONFIG.imageTransitionSpeed / 1000) + 's');
            container.style.setProperty('--neutral-color', VIEWER_CONFIG.imageNeutralColor);

            const updateIndicators = (currentIdx) => {
              const existing = container.querySelector('.photo-indicators');
              if (existing) existing.remove();
              if (photos.length <= 1) return;

              const nav = document.createElement('div');
              nav.className = 'photo-indicators';
              photos.forEach((_, i) => {
                const seg = document.createElement('div');
                seg.className = 'indicator-segment';
                if (i === currentIdx) {
                  seg.classList.add('active');
                  seg.style.setProperty('--photo-time', `${dynamicPhotoTime}ms`);
                } else if (i < currentIdx) {
                  seg.style.background = 'rgba(255,255,255,0.8)';
                }
                nav.appendChild(seg);
              });
              container.appendChild(nav);
            };

            const rotate = () => {
              const oldImg = container.querySelector('.image-item:not(.image-exit)');
              const nextPhoto = photos[idx];
              const newImg = document.createElement('img');
              newImg.src = nextPhoto;
              newImg.className = 'image-item';
              newImg.style.zIndex = "1";

              newImg.onload = () => {
                if (token !== imageUpdateToken) return;
                const mode = VIEWER_CONFIG.imageTransitionMode || 'fade';
                const dir = VIEWER_CONFIG.imageTransitionDirection || 'left';
                const transitionMs = VIEWER_CONFIG.imageTransitionSpeed || 700;

                if (mode === 'cut') {
                  container.appendChild(newImg);
                  newImg.classList.add('active');
                  if (oldImg) oldImg.remove();
                } else if (mode === 'fade') {
                  newImg.classList.add('transition-fade');
                  container.appendChild(newImg);
                  requestAnimationFrame(() => {
                    newImg.classList.add('active');
                    if (oldImg) {
                      oldImg.classList.remove('active');
                      oldImg.style.zIndex = "2";
                      oldImg.classList.add('image-exit');
                      setTimeout(() => oldImg.remove(), (VIEWER_CONFIG.fadeSpeed * 1000) + 100);
                    }
                  });
                } else if (mode === 'slide') {
                  container.appendChild(newImg);
                  if (dir === 'right') {
                    newImg.classList.add('slide-in-right');
                    if (oldImg) {
                      oldImg.classList.remove('active');
                      oldImg.classList.add('slide-out-right');
                    }
                  } else {
                    newImg.classList.add('slide-in-left');
                    if (oldImg) {
                      oldImg.classList.remove('active');
                      oldImg.classList.add('slide-out-left');
                    }
                  }
                  newImg.classList.add('active');
                  if (oldImg) setTimeout(() => oldImg.remove(), transitionMs + 60);
                } else if (mode === 'wipe') {
                  container.appendChild(newImg);
                  if (dir === 'right') newImg.classList.add('wipe-in-right');
                  else newImg.classList.add('wipe-in-left');
                  newImg.classList.add('active');
                  if (oldImg) oldImg.remove();
                } else if (mode === 'scale-blur') {
                  container.appendChild(newImg);
                  newImg.classList.add('scale-blur-in', 'active');
                  if (oldImg) {
                    oldImg.classList.remove('active');
                    oldImg.classList.add('scale-blur-out');
                  }
                  if (oldImg) setTimeout(() => oldImg.remove(), transitionMs + 60);
                } else if (mode === 'fade-through') {
                  let layer = container.querySelector('.neutral-fade-layer');
                  if (!layer) {
                    layer = document.createElement('div');
                    layer.className = 'neutral-fade-layer';
                    container.appendChild(layer);
                  }
                  layer.style.opacity = '1';
                  setTimeout(() => {
                    if (oldImg) oldImg.remove();
                    container.appendChild(newImg);
                    newImg.classList.add('active');
                    layer.style.opacity = '0';
                  }, Math.max(120, Math.floor(transitionMs * 0.5)));
                } else {
                  container.appendChild(newImg);
                  newImg.classList.add('active');
                  if (oldImg) oldImg.remove();
                }
                updateIndicators(idx);
                idx = (idx + 1) % photos.length;
                hasRenderedImages = true;
                clearTimeout(safeTimer);
                signalReady();
              };

              newImg.onerror = () => {
                if (token !== imageUpdateToken) return;
                hasRenderedImages = true;
                clearTimeout(safeTimer);
                signalReady();
              };
            };

            rotate();
            if (photos.length > 1) {
              window.photoInterval = setInterval(rotate, dynamicPhotoTime);
            }
          }, startDelay);
        });
      }

      window.onload = function() {
        window.parent.postMessage('READY', '*');
      };

      window.addEventListener('message', function(event) {
        if (event.data && event.data !== 'READY') {
          const data = event.data;

          runSwipeTransition(() => {
            resetScrollState();
            document.getElementById('view-title').innerText = data.title || '';
            document.getElementById('view-subtitle').innerText = data.subtitle || '';
            const formattedContent = (data.content || '').replace(/\\n/g, '<br>').replace(/\n/g, '<br>');
            document.getElementById('view-text').innerHTML = formattedContent;
            
            // Datum Logica
            if (data.date) {
              const datumObject = new Date(data.date);
              const opties = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
              // Formatteer naar NL (bijv. woensdag 14 januari 2026)
              let datumTekst = datumObject.toLocaleDateString('nl-NL', opties);
              // Eerste letter hoofdletter maken
              datumTekst = datumTekst.charAt(0).toUpperCase() + datumTekst.slice(1);
              document.getElementById('view-date').innerText = "Nieuwsdatum: " + datumTekst;
            } else {
              document.getElementById('view-date').innerText = "";
            }

            // Auteurs Logica
            document.getElementById('view-authors').innerText = "Auteur(s): " + (data.authors || 'Redactie Dekkers-Fransen');

            // Pillen Logica in Blauwe Balk
            const pillContainer = document.getElementById('view-pills');
            pillContainer.innerHTML = '';
            if (data.totalArticles > 1) {
                for (let i = 0; i < data.totalArticles; i++) {
                    const pill = document.createElement('div');
                    pill.className = 'mini-pill';
                    if (i < data.currentIndex) pill.className += ' completed';
                    if (i === data.currentIndex) {
                        pill.className += ' active';
                        pill.style.setProperty('--pill-duration', (data.displayTime / 1000) + 's');
                    }
                    pillContainer.appendChild(pill);
                }
            }

            triggerSwapAnimation();

            // 2. SMART SCROLL LOGIC (NU VOLLEDIG SYNCHROON MET MASTER)
            startScroll(data);

            // 3. PHOTO DISPLAY & CAROUSEL LOGIC
            return updateImages(data);
          });
        }
      });
    </script>
  </body>
</html>
