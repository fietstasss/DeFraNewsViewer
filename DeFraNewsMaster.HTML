<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <title>DeFra News Master</title>
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; 
            background: #fcfcfc; 
        }

        #viewer-wrap {
            width: calc(100vw / var(--viewer-scale, 1));
            height: calc((100vh - var(--bottom-margin, 0vh)) / var(--viewer-scale, 1));
            transform: scale(var(--viewer-scale, 1));
            transform-origin: top left;
        }

        #viewer {
            border: none;
            width: 100%;
            height: 100%;
            background-color: transparent;
            display: block;

            /* Cubic-bezier zorgt voor een 'zachte landing' van het artikel */
            transition: transform var(--fade-speed, 0.8s) cubic-bezier(0.23, 1, 0.32, 1), 
                        opacity var(--fade-speed, 0.8s) ease-in-out;
            transform: translateX(0);
        }

        .slide-prepare {
            transition: none !important;
            transform: translateX(100%) !important;
            opacity: 0;
        }

        #article-nav {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            /* display: flex; */
            display: none;
            gap: 12px;
            z-index: 10000;
        }

        .article-dot {
            width: var(--pill-width, 60px);
            height: 8px;
            background: var(--pill-bg-color, rgba(230, 125, 34, 0.36));
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            transition: background 0.4s ease;
        }

        .article-dot.active::after {
            content: '';
            position: absolute;
            left: 0; top: 0; height: 100%; width: 0%;
            background: var(--pill-active-color, #e67e22);
            animation: articleProgress linear forwards;
            animation-duration: var(--duration, 30s);
        }

        @keyframes articleProgress {
            from { width: 0%; }
            to { width: 100%; }
        }

        .article-dot.completed {
            background: var(--pill-completed-color, #e67e22);
            opacity: 1;
        }

        #bottom-fade {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: var(--bottom-margin, 0vh);
            background: linear-gradient(to bottom, rgba(252, 252, 252, 0), #fcfcfc 70%);
            pointer-events: none;
            z-index: 9999;
        }

        /* --- QR WIDGET OVERLAY --- */
        #qr-widget {
            position: absolute;
            bottom: 55px; 
            left: 40px;   
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10001; 
            background: rgba(255, 255, 255, 0.6); 
            backdrop-filter: blur(2px);
            padding: 12px 18px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .qr-text-block {
            display: flex;
            flex-direction: column;
            align-items: flex-start; 
            margin-top: -5px;
        }

        .qr-title {
            font-family: 'Segoe UI', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            color: rgb(26, 74, 124,1); 
            margin-bottom: -2px;
        }

        .qr-subtitle-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qr-subtitle {
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: rgb(26, 74, 124,1); 
        }

        .qr-arrow {
            width: 35px;
            height: 35px;
        }

        .qr-code {
            width: 75px;
            height: 75px;
            border-radius: 8px;
            object-fit: contain;
            border: 2px solid #eee;
            background: #fff;
        }

        /* TEST MODE INDICATOR */
        #test-indicator {
            position: absolute; 
            top: 350px; 
            left: 500px;
            rotate: 5deg;
            background: #d32f2f; 
            color: white;
            padding: 4px 10px; 
            font-family: sans-serif; 
            font-weight: bold; 
            font-size: 48px;
            border-radius: 4px; 
            z-index: 10002; 
            display: none;
        }
    </style>
</head>

<body>
    <div id="test-indicator">DEV/TEST MODE ACTIVE</div>

    <div id="qr-widget">
        <div class="qr-text-block">
            <span class="qr-title">Voeg jouw nieuws toe!</span>
            
            <div class="qr-subtitle-row">
                <span class="qr-subtitle">shorturl.at/Lp4kc</span>
                
                <svg class="qr-arrow" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#e67e22" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M 3 6 C 3 15, 10 16, 20 16" />
                    <path d="M 15 11 L 21 16 L 15 21" />
                </svg>
            </div>

        </div>
        <img class="qr-code" src="https://dekkersfransen.sharepoint.com/sites/D-F_Bedrijfsdata/Lists/DeFraNewsList/Attachments/7/DeFraNewsForm_QR_URL.png?web=1" alt="QR Code" />
    </div>

    <div id="article-nav"></div>
    <div id="viewer-wrap">
        <iframe id="viewer" src="DeFraNewsViewerTemplate.HTML"></iframe>
    </div>
    <div id="bottom-fade"></div>

    <script>
        // --- MASTER CONFIGURATION ---
        const MASTER_CONFIG = {
            displayTime: 45*1000,            //Time per newsArticle in milliseconds
            fadeSpeed: 2.8,                 //Fade speed between articles in seconds
            transitionType: "slide", 
            pillWidth: "60px",
            pillActiveColor: "#e67e22",
            pillCompletedColor: "#e67e22",
            pillBackgroundColor: "#e67d225c",
            bottomMarginPercent: 0,        // Reserve space at bottom of screen (percent) for newsticker
            defaultZoomPercent: 100,       // Default zoom percent when no URL param is set
            defaultDisplayTimeSec: 45      // Default display time in seconds (URL override)
        };

        const params = new URLSearchParams(window.location.search);
        const playlistUrl = params.get('list');
        const zoomParam = params.get('zoom');
        const zoomPercent = zoomParam ? parseFloat(zoomParam) : MASTER_CONFIG.defaultZoomPercent;
        const displayTimeParam = params.get('displayTime');
        const displayTimeSec = displayTimeParam ? parseFloat(displayTimeParam) : MASTER_CONFIG.defaultDisplayTimeSec;
        const displayTimeMs = (isFinite(displayTimeSec) && displayTimeSec > 0) ? (displayTimeSec * 1000) : MASTER_CONFIG.displayTime;
        const bottomMarginParam = params.get('bottomMargin');
        const bottomMarginPercent = bottomMarginParam ? parseFloat(bottomMarginParam) : MASTER_CONFIG.bottomMarginPercent;
        const zoomScale = (isFinite(zoomPercent) && zoomPercent > 0) ? (zoomPercent / 100) : 1;

        // --- TEST MODE TRIGGER ---
        const isTestMode = params.get('test') === 'true';
        if (isTestMode) document.getElementById('test-indicator').style.display = 'block';

        let articles = [];
        let index = 0;
        let isFirstRun = true;
        let timerStarted = false;
        let viewerReady = false;
        let pendingPayload = null;
        const viewer = document.getElementById('viewer');

        window.addEventListener('message', (e) => {
            if (e.data === 'READY') {
                viewerReady = true;
                if (pendingPayload) {
                    viewer.contentWindow.postMessage(pendingPayload, '*');
                    pendingPayload = null;
                }
            }
        });

        //  Initialize CSS variables based on MASTER_CONFIG
        document.documentElement.style.setProperty('--fade-speed', MASTER_CONFIG.fadeSpeed + 's');
        document.documentElement.style.setProperty('--pill-width', MASTER_CONFIG.pillWidth);
        document.documentElement.style.setProperty('--pill-bg-color', MASTER_CONFIG.pillBackgroundColor);
        document.documentElement.style.setProperty('--pill-active-color', MASTER_CONFIG.pillActiveColor);
        document.documentElement.style.setProperty('--pill-completed-color', MASTER_CONFIG.pillCompletedColor);
        document.documentElement.style.setProperty('--bottom-margin', (isFinite(bottomMarginPercent) ? bottomMarginPercent : MASTER_CONFIG.bottomMarginPercent) + 'vh');
        document.documentElement.style.setProperty('--viewer-scale', zoomScale.toString());
        MASTER_CONFIG.displayTime = displayTimeMs;

        async function loadPlaylist() {
            if (!playlistUrl) return;
            
            try {
                console.log("--- START PLAYLIST CHECK ---");
                const res = await fetch(playlistUrl + (playlistUrl.includes('?') ? '&' : '?') + "t=" + Date.now());
                const data = await res.json();
                
                const currentDate = new Date();
                console.log("Current local time:", currentDate.toLocaleString());

                const rawArticles = data.articles || [];
                
                let validArticles = [];
                let fallbackArticles = []; 

                rawArticles.forEach(a => {
                    const itemStatus = (a.status || a.Status || 'ENABLED').toUpperCase();

                    // 1. Altijd overslaan als Disabled
                    if (itemStatus === 'DISABLED') {
                        console.log(`[DISABLED - SKIPPED] ${a.title}`);
                        return;
                    }

                    // 2. Verzamel Placeholders apart
                    if (itemStatus === 'PLACEHOLDER') {
                        console.log(`[PLACEHOLDER STORED] ${a.title}`);
                        fallbackArticles.push({ ...a });
                        return; 
                    }

                    // 3. Filter voor weergave (Enabled of Test-in-Testmode)
                    const isCandidate = (itemStatus === 'ENABLED') || (itemStatus === 'TEST' && isTestMode);

                    if (isCandidate) {
                        const start = a.start ? new Date(a.start) : new Date(0);
                        const end = a.end ? new Date(a.end) : new Date(8640000000000000);
                        const isValid = currentDate >= start && currentDate <= end;
                        
                        console.log(`[${isValid ? 'LIVE' : 'DATE-SKIP'}] ${a.title} (${itemStatus})`);
                        
                        if (isValid) {
                            validArticles.push(a);
                        }
                    } else if (itemStatus === 'TEST') {
                        console.log(`[TEST ITEM HIDDEN] ${a.title}`);
                    }
                });

                validArticles.sort((a, b) => {
                    const dateA = new Date(a.start || 0);
                    const dateB = new Date(b.start || 0);
                    return dateB - dateA; 
                });

                console.log("Total live articles:", validArticles.length);
                console.log("--- END PLAYLIST CHECK ---");

                if (validArticles.length > 0) {
                    articles = validArticles;
                    renderArticleNav();
                    if (!window.timerStarted) {
                        window.timerStarted = true;
                        index = 0;
                        play();
                    }
                } else if (fallbackArticles.length > 0) {
                    console.log(`No valid articles found. Loading ${fallbackArticles.length} SharePoint placeholder(s).`);
                    articles = fallbackArticles; 
                    renderArticleNav(); 
                    if (!window.timerStarted) {
                        window.timerStarted = true;
                        index = 0;
                        play();
                    }
                } else {
                    showFallback();
                }
            } catch (e) {
                console.error("Error loading playlist:", e);
                showFallback();
            }
        }

        function showFallback() {
            articles = [{
                title: "DEFRANEWS MASTER",
                subtitle: "STATUS: ONLINE",
                content: "Er zijn momenteel geen actuele nieuwsberichten.\n\nControleer de data in SharePoint.",
                images: [] 
            }];
            renderArticleNav();
            document.getElementById('article-nav').innerHTML = '<p style="color:#e67e22; font-family:sans-serif; font-size:14px; font-weight:bold;">GEEN ACTUELE BERICHTEN</p>';
            if (!window.timerStarted) {
                window.timerStarted = true;
                index = 0;
                play();
            }
        }

        function play() {
            if (articles.length === 0) return;
            
            const currentIndex = index;
            const art = articles[currentIndex];

            document.querySelectorAll('.article-dot').forEach((dot, i) => {
                dot.classList.remove('active');
                dot.classList.toggle('completed', i < index);
                if (i === index) {
                    void dot.offsetWidth; 
                    dot.style.setProperty('--duration', (MASTER_CONFIG.displayTime / 1000) + 's');
                    dot.classList.add('active');
                }
            });

            if (isFirstRun) {
                isFirstRun = false;
            }
            updateViewerContent(art, currentIndex);

            index = (index + 1) % articles.length;

            if (index === 0) {
                window.timerStarted = false; 
                setTimeout(loadPlaylist, MASTER_CONFIG.displayTime);
            } else {
                setTimeout(play, MASTER_CONFIG.displayTime);
            }
        }

        function updateViewerContent(art, currentIndex) {
            const payload = {
                title: art.title,
                subtitle: art.subtitle, 
                content: art.content,   
                date: art.start || '',
                authors: art.authors || 'Redactie Dekkers-Fransen',
                images: art.images || [],
                displayTime: MASTER_CONFIG.displayTime,
                currentIndex: currentIndex,     
                totalArticles: articles.length  
            };

            if (viewerReady && viewer.contentWindow) {
                viewer.contentWindow.postMessage(payload, '*');
            } else {
                pendingPayload = payload;
            }
        }

        function renderArticleNav() {
            const nav = document.getElementById('article-nav');
            nav.innerHTML = '';
            if (articles.length > 1) {
                articles.forEach((_, i) => {
                    const dot = document.createElement('div');
                    dot.className = 'article-dot';
                    dot.id = 'dot-' + i;
                    nav.appendChild(dot);
                });
            }
        }

        if (playlistUrl) loadPlaylist();
    </script>
</body>
</html>
